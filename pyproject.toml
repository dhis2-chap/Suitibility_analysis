[project]
name = "suitability-correlation-analysis"
version = "0.1.0"
description = "Correlation analysis between climate suitability scores and observed disease cases"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "joblib",
    "matplotlib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
